name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend directory
        id: detect
        run: |
          echo "--- ls repo root ---"
          ls -la
          if [ -f frontend/package.json ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
            echo "build_out=frontend/build" >> $GITHUB_OUTPUT
            echo "--- ls frontend ---"
            ls -la frontend
          elif [ -f package.json ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "build_out=build" >> $GITHUB_OUTPUT
          else
            echo "ERROR: package.json not found" && exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ -f yarn.lock ]; then
            echo "yarn.lock found — installing with lockfile"
            yarn install --frozen-lockfile || yarn install
          else
            echo "yarn.lock NOT found — generating fresh install"
            yarn install
          fi

      - name: Build
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          REACT_APP_BASENAME: /Agenda-Bella
          PUBLIC_URL: /Agenda-Bella
          CI: false
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.build_out }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

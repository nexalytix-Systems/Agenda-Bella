name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend directory
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
            echo "build_out=frontend/build" >> $GITHUB_OUTPUT
            echo "lock=frontend/yarn.lock" >> $GITHUB_OUTPUT
          elif [ -f package.json ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "build_out=build" >> $GITHUB_OUTPUT
            echo "lock=yarn.lock" >> $GITHUB_OUTPUT
          else
            echo "package.json not found at repo root or in frontend/" && exit 1
          fi
          echo "Detected frontend dir: $(cat $GITHUB_OUTPUT | grep dir=)"
          echo "--- ls repo root ---"
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ${{ steps.detect.outputs.lock }}

      - name: Install
        working-directory: ${{ steps.detect.outputs.dir }}
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          PUBLIC_URL: ./
          CI: false
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.build_out }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
